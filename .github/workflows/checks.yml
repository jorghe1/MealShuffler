name: Checks

# The Swift build needs a macOS runner and paid minutes. These checks are pure
# Python, run free on Linux in seconds, and catch the class of breakage that is
# otherwise only found by a full Xcode build: drifted Norwegian strings,
# unbalanced braces or stale symbols after a refactor, views calling store
# members that no longer exist, and argument labels left behind by a rename.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-checks:
    name: Localization, structure and store API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Norwegian localization
        run: python3 ci/validate-localizations.py

      - name: Check localized format arguments
        run: python3 ci/check-localized-format.py

      - name: Check Swift structure
        run: python3 ci/check-swift-structure.py

      - name: Check store API against views
        run: python3 ci/check-store-api.py

      - name: Check argument labels against the functions they call
        run: python3 ci/check-swift-call-labels.py

      - name: Lint property lists
        run: |
          python3 - <<'PY'
          import plistlib, sys
          for path in ("MealShuffler/Info.plist", "MealShuffler/PrivacyInfo.xcprivacy"):
              with open(path, "rb") as handle:
                  plistlib.load(handle)
              print("ok", path)
          PY

  release:
    name: Release scripts and CI config
    runs-on: ubuntu-latest
    # The release path only runs on a tag, against Codemagic, where a typo costs a signed
    # build or silently starts nothing. These checks are what can be proven on Linux first.
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck release scripts
        run: shellcheck -S warning ci/check-release-tag.sh ci/set-build-number.sh

      - name: Parse codemagic.yaml and workflows
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml
          for path in ["codemagic.yaml", *sorted(glob.glob(".github/workflows/*.yml"))]:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print("ok", path)
          with open("codemagic.yaml", encoding="utf-8") as handle:
              workflows = yaml.safe_load(handle)["workflows"]
          # Releases are started by release-testflight.yml through the API; a trigger here
          # would build twice as soon as a webhook exists.
          for name, workflow in workflows.items():
              assert "triggering" not in workflow, f"{name} has a triggering block"
          assert "ios-testflight" in workflows
          PY

      - name: Release tag must match MARKETING_VERSION
        run: |
          version="$(sed -n -E 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]#]+)"?.*$/\1/p' project.yml | head -n 1)"
          bash ci/check-release-tag.sh "ios-$version"
          if bash ci/check-release-tag.sh "ios-0.0.0-not-this"; then
            echo "check-release-tag.sh accepted a mismatched tag"; exit 1
          fi
          if bash ci/check-release-tag.sh "ios-0.0.0"; then
            echo "check-release-tag.sh accepted a mismatched tag"; exit 1
          fi
          DRY_RUN=1 PROJECT_BUILD_NUMBER=7 bash ci/set-build-number.sh | grep -q "Build number: 7 "

  server:
    name: Recipe service
    runs-on: ubuntu-latest
    # The Worker had drifted past its own pinned SDK: `messages.parse` and the zod helper
    # arrived after 0.71, so the committed source could not have compiled. Nothing was
    # running tsc, which is why nobody noticed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm test

      - name: Test bundled share pages
        working-directory: server
        run: npm run test:bundle
