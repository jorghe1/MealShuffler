name: Checks

# The Swift build needs a macOS runner and paid minutes. These three checks are
# pure Python, run free on Linux in seconds, and catch the class of breakage that
# is otherwise only found by a full Xcode build: drifted Norwegian strings,
# unbalanced braces or stale symbols after a refactor, and views calling store
# members that no longer exist.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-checks:
    name: Localization, structure and store API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Norwegian localization
        run: python3 ci/validate-localizations.py

      - name: Check localized format arguments
        run: python3 ci/check-localized-format.py

      - name: Check Swift structure
        run: python3 ci/check-swift-structure.py

      - name: Check store API against views
        run: python3 ci/check-store-api.py

      - name: Check argument labels against the functions they call
        run: python3 ci/check-swift-call-labels.py

      - name: Lint property lists
        run: |
          python3 - <<'PY'
          import plistlib, sys
          for path in ("MealShuffler/Info.plist", "MealShuffler/PrivacyInfo.xcprivacy"):
              with open(path, "rb") as handle:
                  plistlib.load(handle)
              print("ok", path)
          PY

  server:
    name: Recipe service
    runs-on: ubuntu-latest
    # The Worker had drifted past its own pinned SDK: `messages.parse` and the zod helper
    # arrived after 0.71, so the committed source could not have compiled. Nothing was
    # running tsc, which is why nobody noticed.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm test
