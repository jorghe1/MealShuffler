# Meal Shuffler – native SwiftUI to simulator and TestFlight.
#
# This reuses the App Store Connect integration and signing variable group from
# the Fiks project. See docs/IPHONE_TESTING.md for the one-time Apple setup.

workflows:
  ios-smoke:
    name: iOS · Simulator smoke test
    instance_type: mac_mini_m2
    max_build_duration: 30

    # Unsigned, so this needs nothing from Apple Developer -- it answers "does it
    # compile and do the tests pass" without any App ID, profile or App Group setup.
    #
    # Manual only: no `triggering` block on purpose. GitHub Actions (ios-validation.yml)
    # already builds and tests every push to main and claude/** for free, so a push trigger
    # here would only spend Codemagic minutes on the same answer -- and there is no
    # GitHub -> Codemagic webhook anyway (see docs/CODEMAGIC.md). Start it by hand when
    # you want Codemagic's exact Xcode image to compile a branch.

    environment:
      xcode: 26.4
    scripts:
      - name: Generate the Xcode project
        script: bash ci/bootstrap-ios.sh
      - name: Run unit tests
        script: bash ci/test-ios.sh
    artifacts:
      - build/*.xcresult
      - build/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: fiks_app_store_connect

    environment:
      xcode: 26.4
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "no.mealshuffler.app"
        # Each embedded extension is signed separately and needs its own profile.
        WIDGET_BUNDLE_ID: "no.mealshuffler.app.widget"
        SHARE_BUNDLE_ID: "no.mealshuffler.app.share"
        XCODE_PROJECT: "MealShuffler.xcodeproj"
        XCODE_SCHEME: "MealShuffler"

    # No `triggering` block on purpose. Pushing an `ios-*` tag runs
    # .github/workflows/release-testflight.yml, which checks the tag against
    # MARKETING_VERSION and starts this workflow through the Codemagic REST API with the
    # tag. That works without a GitHub -> Codemagic webhook (there is none). A tag trigger
    # here would build every release twice the day someone adds the webhook back.
    # Starting it by hand from the Codemagic UI still works (see docs/CODEMAGIC.md).

    scripts:
      # First, before anything slow: a tag that does not match MARKETING_VERSION would upload
      # under the wrong version. Branch builds started by hand have no CM_TAG and pass.
      - name: Check release tag against MARKETING_VERSION
        script: bash ci/check-release-tag.sh

      - name: Generate and validate the Xcode project
        script: bash ci/bootstrap-ios.sh

      - name: Run unit tests before signing
        script: bash ci/test-ios.sh

      # max(latest App Store Connect build + 1, PROJECT_BUILD_NUMBER). Codemagic's counter
      # alone resets if the app is re-added and then collides with builds Apple already has.
      - name: Set build number from App Store Connect
        script: bash ci/set-build-number.sh

      - name: Fetch or create App Store signing files
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          # The app and every embedded extension need their own profile. Fetching only
          # the app bundle id leaves the widget unsigned, and the archive then fails
          # late, at export, with a bare "no matching profile" message.
          for id in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID" "$SHARE_BUNDLE_ID"; do
            app-store-connect fetch-signing-files "$id" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
          done

      - name: Add signing certificate to the build keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply provisioning profile
        script: xcode-project use-profiles

      # `xcodebuild archive` reports an entitlement mismatch as a bare "Failed to archive",
      # with the real reason buried in its own log. Printing what the project asks for next
      # to what the profiles actually grant makes that failure readable at a glance.
      - name: Report entitlements requested vs granted
        ignore_failure: true
        script: |
          echo "=== Requested by the project ==="
          for f in MealShuffler/MealShuffler.entitlements \
                   MealShufflerWidget/MealShufflerWidget.entitlements \
                   MealShufflerShare/MealShufflerShare.entitlements; do
            echo "--- $f"
            plutil -p "$f" || true
          done
          echo
          echo "=== Granted by the fetched provisioning profiles ==="
          for profile in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            [ -e "$profile" ] || continue
            echo "--- $(basename "$profile")"
            security cms -D -i "$profile" 2>/dev/null \
              | plutil -extract Entitlements xml1 -o - - 2>/dev/null \
              | plutil -p - 2>/dev/null \
              | grep -E "application-identifier|application-groups|com.apple.developer" || echo "  (none read)"
          done
          echo
          echo "If a profile is missing com.apple.security.application-groups, enable the"
          echo "App Groups capability on that App ID in Apple Developer and rebuild."

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      # Collected even on failure -- this is where the real archive error lives.
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/**/*.xcarchive
      - build/*.xcresult
      - build/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # The IPA is still uploaded and appears under TestFlight. Keep beta
        # review off for the first internal-device rounds.
        submit_to_testflight: false
        submit_to_app_store: false
