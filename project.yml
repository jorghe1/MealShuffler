name: MealShuffler
options:
  bundleIdPrefix: no.mealshuffler
  developmentLanguage: en
  useBaseInternationalization: false
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MealShuffler:
    type: application
    platform: iOS
    sources:
      - path: MealShuffler
        excludes:
          - Info.plist
    dependencies:
      - target: MealShufflerWidget
        embed: true
      - target: MealShufflerShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MealShuffler/Info.plist
        CODE_SIGN_ENTITLEMENTS: MealShuffler/MealShuffler.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - MealShufflerTests

  # Extensions run in their own process and cannot see the app's memory, so everything they
  # touch is compiled into them as well. This is the model layer and the state repository
  # only -- deliberately not the store, generator or views, which would drag SwiftUI,
  # Vision and PhotosUI into a widget.
  MealShufflerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MealShufflerWidget
        excludes:
          - Info.plist
          - MealShufflerWidget.entitlements
      - path: MealShuffler/Models
      - path: MealShuffler/Data
      - path: MealShuffler/Localization
      - path: MealShuffler/Theme
      - path: MealShuffler/Resources
      - path: MealShuffler/App/AppGroup.swift
      - path: MealShuffler/Services/AppStateRepository.swift
      - path: MealShuffler/Services/IngredientUnits.swift
      - path: MealShuffler/Services/PlannedDinnerReader.swift
    info:
      path: MealShufflerWidget/Info.plist
      properties:
        CFBundleDisplayName: Meal Shuffler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app.widget
        CODE_SIGN_ENTITLEMENTS: MealShufflerWidget/MealShufflerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Captures what was shared and returns immediately. Extraction is a network round trip and
  # share extensions are killed for taking too long, so the app does that work on next open.
  MealShufflerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MealShufflerShare
        excludes:
          - Info.plist
          - MealShufflerShare.entitlements
      - path: MealShuffler/Models
      - path: MealShuffler/Data
      - path: MealShuffler/Localization
      - path: MealShuffler/Theme
      - path: MealShuffler/Resources
      - path: MealShuffler/App/AppGroup.swift
      - path: MealShuffler/Services/AppStateRepository.swift
      - path: MealShuffler/Services/IngredientUnits.swift
      - path: MealShuffler/Services/PlannedDinnerReader.swift
      - path: MealShuffler/Services/RecipeInbox.swift
    info:
      path: MealShufflerShare/Info.plist
      properties:
        CFBundleDisplayName: Meal Shuffler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app.share
        CODE_SIGN_ENTITLEMENTS: MealShufflerShare/MealShufflerShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  MealShufflerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealShufflerTests
    dependencies:
      - target: MealShuffler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.tests
        GENERATE_INFOPLIST_FILE: YES
