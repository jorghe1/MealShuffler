name: MealShuffler
options:
  bundleIdPrefix: no.mealshuffler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MealShuffler:
    type: application
    platform: iOS
    sources:
      - path: MealShuffler
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MealShuffler/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - MealShufflerTests
  MealShufflerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealShufflerTests
    dependencies:
      - target: MealShuffler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.tests
        GENERATE_INFOPLIST_FILE: YES
