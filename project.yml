name: MealShuffler
options:
  bundleIdPrefix: no.mealshuffler
  developmentLanguage: en
  useBaseInternationalization: false
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    # Deployed URL of server/. Override per build:
    #   xcodebuild ... RECIPE_SERVICE_BASE_URL=https://your-worker.workers.dev
    # Empty leaves the app on its on-device parsers.
    RECIPE_SERVICE_BASE_URL: ""
    # The App Store page, once there is one: the share card's QR code and link. Empty leaves
    # them off.
    APP_STORE_URL: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Still Swift 5 mode, so these are warnings, not errors: a map of what Swift 6 will reject.
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MealShuffler:
    type: application
    platform: iOS
    sources:
      - path: MealShuffler
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      # Named explicitly so the manifest lands in Copy Bundle Resources whatever XcodeGen
      # infers for the file type. App Store validation reads it from the bundle.
      - path: MealShuffler/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: MealShufflerWidget
        embed: true
      - target: MealShufflerShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MealShuffler/Info.plist
        CODE_SIGN_ENTITLEMENTS: MealShuffler/MealShuffler.entitlements
        # iPhone and iPad: the iPad is the kitchen board on the fridge or the counter.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - MealShufflerTests

  # Extensions run in their own process and cannot see the app's memory, so everything they
  # touch is compiled into them as well. This is the model layer and the state repository
  # only -- deliberately not the store, generator or views, which would drag SwiftUI,
  # Vision and PhotosUI into a widget.
  MealShufflerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MealShufflerWidget
        excludes:
          - Info.plist
          - MealShufflerWidget.entitlements
          - PrivacyInfo.xcprivacy
      # Each extension needs its own privacy manifest; upload validation checks them one by one.
      - path: MealShufflerWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: MealShuffler/Models
      - path: MealShuffler/Data
      - path: MealShuffler/Localization
      - path: MealShuffler/Theme
      - path: MealShuffler/Resources
      - path: MealShuffler/App/AppGroup.swift
      - path: MealShuffler/Services/AppStateRepository.swift
      - path: MealShuffler/Services/StateMigrations.swift
      - path: MealShuffler/Services/IngredientUnits.swift
      - path: MealShuffler/Services/PlannedDinnerReader.swift
      # The interactive "We cooked this" intent and the cooking timer's Live Activity
      # attributes, which the app and the widget must agree on.
      - path: MealShuffler/Shared
    info:
      path: MealShufflerWidget/Info.plist
      properties:
        # XcodeGen defaults a generated extension plist to 1.0/1, while the app's own
        # checked-in plist expands the build settings. App Store validation rejects that
        # mismatch outright -- ITMS-90474 for the marketing version, ITMS-90473 for the
        # build number -- at upload, after the whole signed archive has been produced.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Meal Shuffler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app.widget
        CODE_SIGN_ENTITLEMENTS: MealShufflerWidget/MealShufflerWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Captures what was shared and returns immediately. Extraction is a network round trip and
  # share extensions are killed for taking too long, so the app does that work on next open.
  MealShufflerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MealShufflerShare
        excludes:
          - Info.plist
          - MealShufflerShare.entitlements
          - PrivacyInfo.xcprivacy
      # Each extension needs its own privacy manifest; upload validation checks them one by one.
      - path: MealShufflerShare/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: MealShuffler/Models
      - path: MealShuffler/Data
      - path: MealShuffler/Localization
      - path: MealShuffler/Theme
      - path: MealShuffler/Resources
      - path: MealShuffler/App/AppGroup.swift
      - path: MealShuffler/Services/AppStateRepository.swift
      - path: MealShuffler/Services/StateMigrations.swift
      - path: MealShuffler/Services/IngredientUnits.swift
      - path: MealShuffler/Services/PlannedDinnerReader.swift
      - path: MealShuffler/Services/RecipeInbox.swift
    info:
      path: MealShufflerShare/Info.plist
      properties:
        # XcodeGen defaults a generated extension plist to 1.0/1, while the app's own
        # checked-in plist expands the build settings. App Store validation rejects that
        # mismatch outright -- ITMS-90474 for the marketing version, ITMS-90473 for the
        # build number -- at upload, after the whole signed archive has been produced.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Meal Shuffler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.app.share
        CODE_SIGN_ENTITLEMENTS: MealShufflerShare/MealShufflerShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  MealShufflerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealShufflerTests
    dependencies:
      - target: MealShuffler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.tests
        GENERATE_INFOPLIST_FILE: YES

  # Screenshot smoke flows that drive the real app on a simulator. Deliberately left out of
  # the MealShuffler scheme above: ci/test-ios.sh runs that scheme before every TestFlight
  # build, and a flaky UI test must never block a release. They run from their own scheme,
  # MealShufflerUITests, defined under `schemes:` at the end of this file.
  MealShufflerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MealShufflerUITests
    dependencies:
      - target: MealShuffler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.mealshuffler.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MealShuffler
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  # Run with: xcodebuild test -scheme MealShufflerUITests -destination 'platform=iOS Simulator,name=iPhone 16'
  MealShufflerUITests:
    build:
      targets:
        MealShuffler: all
        MealShufflerUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MealShufflerUITests
