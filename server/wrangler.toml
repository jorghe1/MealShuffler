name = "mealshuffler-extract"
main = "src/index.ts"
# Share-page functions are serialized into browser JavaScript. Name-preservation
# helpers would capture Worker-only scope and break every valid share after bundling.
keep_names = false
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Per-install cap. A courtesy limit: the key comes from a header the client chooses, so it
# stops an honest client looping and nothing else.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-IP cap. The one that actually holds, because the caller does not pick the key.
#
# Without it the whole control was `X-Install-Id`, and a fresh UUID per request bought
# unlimited access to a model call carrying tens of thousands of input tokens. Set a little
# above the per-install limit so a household behind one NAT is not throttled by itself.
[[unsafe.bindings]]
name = "IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

# Workers Logs keeps the Worker's own one-line JSON logs (route label, status, duration) for
# monitoring, and nothing that could carry user data:
#   - redact_query_string: the Bring! list travels in /v1/bring/list?d=... A logged URL would
#     be a logged shopping list.
#   - invocation_logs = false: the per-request metadata record (URL, headers such as
#     X-Install-Id and CF-Connecting-IP) is not kept.
# docs/PRIVACY.md promises both. Do not loosen this, add Logpush or a Tail Worker, or save
# `wrangler tail` output without changing that policy first.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
invocation_logs = false

# Set with: wrangler secret put ANTHROPIC_API_KEY
# Never commit the key; the whole point of the proxy is keeping it out of the IPA.

[vars]
DAILY_MODEL_CALL_LIMIT = "200"
# Chosen with eval/ on 12 October 2026: Haiku 5.5 97.7 %, 4.2 s; Sonnet 5.5 98.8 %, 5.1 s;
# Opus 5 98.8 %, 8.9 s -- on 24 Norwegian text recipes, at about 1/20 of Sonnet's price.
# Re-run the eval before changing it, and add photo pages to it before trusting a switch.
EXTRACTION_MODEL = "claude-haiku-5-5"
# Contact address on /privacy and /support. Empty: the pages say to use the App Store page.
SUPPORT_EMAIL = ""

[[durable_objects.bindings]]
name = "MODEL_BUDGET"
class_name = "ModelBudget"

[[migrations]]
tag = "v1-model-budget"
new_sqlite_classes = ["ModelBudget"]
